<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Результат — TEST BASE</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">TB</span><span>TEST BASE</span></a><span class="topbar-note">Результаты тестирования</span></header>
  <main class="container result-container">
    <section class="result-card"><div class="result-icon">✓</div><div class="eyebrow">ТЕСТ ЗАВЕРШЁН</div><h1 id="resultTitle">Результат тестирования</h1><p class="muted">Ваш результат сохранён для текущего просмотра.</p><div class="score-number" id="scoreNumber">0%</div><div class="score-caption">ПРАВИЛЬНЫХ ОТВЕТОВ</div><div class="result-stats"><div><strong id="correctCount">0</strong><span>Правильно</span></div><div><strong id="totalCount">0</strong><span>Всего вопросов</span></div><div><strong id="gradeValue">—</strong><span>Оценка</span></div></div><div class="result-actions"><a class="button button-primary" href="index.html">Вернуться в каталог</a></div></section>
    <p id="integrityNote" class="muted small result-note">Правильные ответы и разбор вопросов не отображаются.</p>
  </main>
  <script src="js/result.js"></script>
</body>
</html>
